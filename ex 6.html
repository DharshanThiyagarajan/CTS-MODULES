<form>
  Phone: <input type="text" id="phone" onblur="validatePhone(this)">
  <br>
  Event Fee:
  <select onchange="document.getElementById('fee').textContent=this.value">
    <option value="Free">Free</option>
    <option value="$10">$10</option>
  </select>
  <span id="fee"></span>
  <br>
  <button type="button" onclick="alert('Submitted!')">Submit</button>
  <br>
  <img src="event.jpg" ondblclick="this.style.width='300px'" width="150">
  <br>
  Feedback:
  <textarea onkeyup="document.getElementById('charCount').textContent=this.value.length"></textarea>
  <p>Characters: <span id="charCount">0</span></p>
</form>

<script>
function validatePhone(input) {
  if (!/^[0-9]{10}$/.test(input.value)) {
    alert('Enter 10-digit phone number');
  }
}
</script>
