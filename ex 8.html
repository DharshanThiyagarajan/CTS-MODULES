<select id="eventSelect" onchange="savePref()">
  <option value="music">Music</option>
  <option value="sports">Sports</option>
</select>
<button onclick="clearPrefs()">Clear Preferences</button>

<script>
function savePref() {
  const val = document.getElementById("eventSelect").value;
  localStorage.setItem("eventType", val);
}

function clearPrefs() {
  localStorage.clear();
  sessionStorage.clear();
}

window.onload = () => {
  const saved = localStorage.getItem("eventType");
  if (saved) {
    document.getElementById("eventSelect").value = saved;
  }
};
</script>
