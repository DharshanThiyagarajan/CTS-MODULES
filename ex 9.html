<button onclick="findLocation()">Find Nearby Events</button>
<p id="locationInfo"></p>

<script>
function findLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPos, showError, { enableHighAccuracy: true, timeout: 5000 });
  } else {
    document.getElementById("locationInfo").textContent = "Geolocation not supported.";
  }
}

function showPos(pos) {
  document.getElementById("locationInfo").textContent = `Latitude: ${pos.coords.latitude}, Longitude: ${pos.coords.longitude}`;
}

function showError(error) {
  document.getElementById("locationInfo").textContent = `Error: ${error.message}`;
}
</script>
