<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <link href="css/bootstrap.min.css" rel="stylesheet">
              <script src="js/bootstrap.bundle.min.js"></script>


</head>
<body>
    <div class="container mt-5">
  <div class="bg-light border m-3 p-2">
    <p>This box has <strong>m-3</strong> (margin on all sides) and <strong>p-2</strong> (padding on all sides).</p>
  </div>

  <div class="bg-warning border mt-4 py-5 px-3">
    <p>This box has <strong>mt-4</strong> (margin top), <strong>py-5</strong> (vertical padding), and <strong>px-3</strong> (horizontal padding).</p>
  </div>
</div>

<div class="container mt-5">
  <div class="row text-center">
    <div class="col-md-4 mb-4">
      <div class="border p-4 bg-light">
        <h3 class="mb-3">Basic</h3>
        <p class="h4">$10/mo</p>
        <p class="text-muted">Perfect for individuals</p>
        <button class="btn btn-outline-primary mt-3">Select</button>
      </div>
    </div>
    <div class="col-md-4 mb-4">
      <div class="border p-5 bg-white shadow-sm">
        <h3 class="mb-3">Pro</h3>
        <p class="h4">$25/mo</p>
        <p class="text-muted">Best for teams</p>
        <button class="btn btn-primary mt-3">Select</button>
      </div>
    </div>
    <div class="col-md-4 mb-4">
      <div class="border p-4 bg-light">
        <h3 class="mb-3">Enterprise</h3>
        <p class="h4">$50/mo</p>
        <p class="text-muted">For large organizations</p>
        <button class="btn btn-outline-dark mt-3">Select</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
