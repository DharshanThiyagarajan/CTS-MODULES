<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Grid</title>
 <link href="css/bootstrap.min.css" rel="stylesheet">
  <script src="js/bootstrap.bundle.min.js"></script>

</head>
<body>

  <div class="container mt-4">
    <div class="row">
      <div class="col-12 col-md-6 col-lg-4 bg-primary text-white p-3 mb-3">Col 1</div>
      <div class="col-12 col-md-6 col-lg-4 bg-success text-white p-3 mb-3">Col 2</div>
      <div class="col-12 col-md-6 col-lg-4 bg-warning text-white p-3 mb-3">Col 3</div>
    </div>
  </div>

  <div class="container mt-5">
  <div class="row">
    <div class="col-sm-4 bg-light border p-3 text-center">Column A</div>
    <div class="col-sm-4 bg-light border p-3 text-center">Column B</div>
    <div class="col-sm-4 bg-light border p-3 text-center">Column C</div>
  </div>
</div>

</body>
</html>
