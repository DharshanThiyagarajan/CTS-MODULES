<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <link href="css/bootstrap.min.css" rel="stylesheet">
              <script src="js/bootstrap.bundle.min.js"></script>


</head>
<body>
    <div class="container mt-5">
  <div class="p-3 bg-warning d-none d-md-block">
    <p>This box is hidden on small screens and <strong>visible on medium and up</strong>.</p>
  </div>

  <div class="p-3 bg-success text-white d-none d-lg-flex">
    <p>This box is hidden on screens smaller than large and <strong>flex visible on large and up</strong>.</p>
  </div>
</div>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-3 bg-light p-3 d-none d-md-block">
      <h5>Sidebar</h5>
      <p>This sidebar is visible on tablets and desktops only.</p>
    </div>

    <div class="col-md-9 col-12 bg-white p-3 border">
      <h5>Main Content</h5>
      <p>This content is always visible.</p>
    </div>
  </div>
</div>

</body>
</html>
